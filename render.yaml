services:
  - type: web
    name: ga5-solutions
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: Q3_HOME_DIR
        value: /home/agent
      - key: Q3_CWD
        value: /home/agent/workspace
      - key: Q3_SECRET_REL
        value: .bashrc
      - key: Q3_WRITE_DIR
        value: /data/agent/outbox/
      - key: Q3_ALLOWED_DOMAINS
        value: registry.npmjs.org,api.github.com
